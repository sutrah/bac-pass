name: Deploy FTP

# Se déclenche à chaque push sur main, et après chaque sync Pronote réussi sur main.
# Le second déclencheur est indispensable : un push fait par le bot de sync (GITHUB_TOKEN)
# ne déclenche PAS les autres workflows, donc sans lui le site en ligne ne recevait jamais
# les nouvelles moyennes. Peut aussi être lancé à la main (bouton "Run workflow").
on:
  push:
    branches: [main]
    paths:
      - 'dashboard.html'
      - 'pronote.json'
  workflow_run:
    workflows: ['Sync Pronote']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # après un sync : la version que le bot vient de pousser

      # SFTP (port 22) : le serveur OVH refuse le FTPS explicite ("500 This security scheme
      # is not implemented"), ce qui faisait échouer tous les déploiements. Mêmes identifiants.
      - name: Déployer dashboard.html et pronote.json sur l'hébergement OVH (SFTP)
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          HOST=ftp.cluster026.hosting.ovh.net
          command -v sshpass >/dev/null || sudo apt-get install -y -q sshpass
          mkdir -p ~/.ssh && ssh-keyscan -T 20 "$HOST" >> ~/.ssh/known_hosts
          printf 'put dashboard.html\nput pronote.json\nls -l\n' |
            sshpass -e sftp -o PreferredAuthentications=password -o PubkeyAuthentication=no \
              -b - "$FTP_USERNAME@$HOST:games/bac-pass"
