name: Sync Pronote

on:
  schedule:
    # Toutes les heures de 7h à 22h (heure de Paris en hiver ; 8h-23h en été, le cron
    # ne suit pas le changement d'heure). Minute 23 pour éviter l'embouteillage de :00.
    # Un commit n'est créé que si les données Pronote ont changé.
    - cron: '23 6-21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer pronotepy
        run: pip install 'pronotepy==2.15.7'

      - name: Récupérer les moyennes depuis Pronote
        env:
          PRONOTE_URL: ${{ secrets.PRONOTE_URL }}
          PRONOTE_USERNAME: ${{ secrets.PRONOTE_USERNAME }}
          PRONOTE_PASSWORD: ${{ secrets.PRONOTE_PASSWORD }}
          # Lancement manuel : affiche aussi la liste des matières (noms seulement).
          PRONOTE_DIAG: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/sync_pronote.py

      - name: Publier les changements
        run: |
          git config user.name "sync-pronote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html pronote.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Sync Pronote $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
