name: Sync Pronote

on:
  schedule:
    # 06h00 et 17h00 UTC = 08h00 et 19h00 heure de Paris en hiver (09h/20h en été,
    # le cron ne suit pas le changement d'heure -- décalage d'1h acceptable ici).
    - cron: '0 6,17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer pronotepy
        run: pip install pronotepy

      - name: Récupérer les moyennes depuis Pronote
        env:
          PRONOTE_URL: ${{ secrets.PRONOTE_URL }}
          PRONOTE_USERNAME: ${{ secrets.PRONOTE_USERNAME }}
          PRONOTE_PASSWORD: ${{ secrets.PRONOTE_PASSWORD }}
        run: python3 scripts/sync_pronote.py

      - name: Publier les changements
        run: |
          git config user.name "sync-pronote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Sync Pronote $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
