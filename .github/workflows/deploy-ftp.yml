name: Deploy FTP

# Se déclenche à chaque push sur main, et après chaque sync Pronote réussi sur main.
# Le second déclencheur est indispensable : un push fait par le bot de sync (GITHUB_TOKEN)
# ne déclenche PAS les autres workflows, donc sans lui le site en ligne ne recevait jamais
# les nouvelles moyennes. Peut aussi être lancé à la main (bouton "Run workflow").
on:
  push:
    branches: [main]
    paths:
      - 'dashboard.html'
      - 'pronote.json'
  workflow_run:
    workflows: ['Sync Pronote']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # après un sync : la version que le bot vient de pousser

      - name: Déployer dashboard.html et pronote.json sur le FTP OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster026.hosting.ovh.net
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /games/bac-pass/
          local-dir: ./
          # N'envoie que ce qui compose le site -- pas le dépôt Git entier.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/scripts/**
            **/*.md
